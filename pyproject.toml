[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "graphrag-enterprise-engine"
version = "0.1.0"
description = "Enterprise GraphRAG Intelligence Engine - High-Performance Async AI Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.12",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "qdrant-client>=1.12.0",
    "neo4j>=5.26.0",
    "redis>=5.2.0",
    "celery>=5.4.0",
    "aiofiles>=24.1.0",
    "pypdf>=5.1.0",
    "langgraph>=0.2.50",
    "sentence-transformers>=3.3.0",
    "tenacity>=9.0.0",
    "httpx>=0.27.2",
]

[tool.setuptools.packages.find]
where = ["."]
